models:
  # Baseline
  - yolo11

  # ============================================================
  # POSITION A: Neck solo P3 (min variant - small objects focus)
  # Dopo C3k2 finale P3, prima di Detect
  # ============================================================
  - yolo11_gam_min
  - yolo11_simam_min
  - yolo11_triplet_min
  - yolo11_coordatt_min

  # ============================================================
  # POSITION B: Neck P3+P4 (full variant)
  # ============================================================
  - yolo11_gam_full
  - yolo11_simam        # exists: yolo11_simam.yaml
  - yolo11_triplet      # exists: yolo11_triplet.yaml
  - yolo11_coordatt_full

  # ============================================================
  # POSITION D: Backbone fine stage P3 e P4 (dopo C3k2)
  # ============================================================
  - yolo11_gam_bbone_p3p4
  - yolo11_simam_bbone_p3p4
  - yolo11_triplet_bbone_p3p4
  - yolo11_coordatt_bbone_p3p4

  # Reference
  - yolo26

datasets:
  - name: tomatoes
    path: data/tomatoes/yolotomato_bboxes.yaml
    project: runs/complete/tomatoes
  - name: lettuces
    path: data/lettuce-omni-ul/lettuce-omni-ul.yaml
    project: runs/complete/lettuces

training:
  epochs: 100
  batch: 16
  imgsz: 640
  fraction: 1.0
  device: 0
  patience: 50
  scale: n