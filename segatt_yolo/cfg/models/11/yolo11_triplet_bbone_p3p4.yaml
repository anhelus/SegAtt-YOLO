# YOLO11n: TripletAttention backbone at end of P3 and P4 stages

nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone with TripletAttention after P3 and P4 stages
backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 1, TripletAttention, []]  # 4 <-- Triplet after P3 stage (256 ch)
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]     # 6-P4/16
  - [-1, 1, TripletAttention, []]  # 7 <-- Triplet after P4 stage (512 ch)
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]       # 11
  - [-1, 2, C2PSA, [1024]]         # 12

# Head (standard, indices adjusted for extra backbone layers)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 7], 1, Concat, [1]]                    # 14 (concat P4 backbone)
  - [-1, 2, C3k2, [512, False]]                  # 15 (P4-head)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 4], 1, Concat, [1]]                    # 17 (concat P3 backbone)
  - [-1, 2, C3k2, [256, False]]                  # 18 (P3-small output)

  - [-1, 1, Conv, [256, 3, 2]]                   # 19
  - [[-1, 15], 1, Concat, [1]]                   # 20
  - [-1, 2, C3k2, [512, False]]                  # 21 (P4-medium output)

  - [-1, 1, Conv, [512, 3, 2]]                   # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23 (connect to C2PSA backbone)
  - [-1, 2, C3k2, [1024, True]]                  # 24 (P5-large output)

  - [[18, 21, 24], 1, Detect, [nc]]              # Detect(P3, P4, P5)